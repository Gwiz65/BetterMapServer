classname=org.gwiz.wurmunlimited.mods.BetterMapServer
classpath=bettermapserver.jar
depend.import=serverpacks
#
# allow info sent to client
allowDeeds=true
allowStartTowns=true
allowSoulfallStones=true
#
# scheduleMapUpdates - Turn map update scheduler on/off. Default: true (on)
scheduleMapUpdates=true
# updateTime - Time of day (local time) to schedule map updates in 24-hour format. Default: 00:00 (midnight)
updateTime=00:00
# updatePeriod - Period between map updates in days. Default: 1 (everyday)
updatePeriod=1
